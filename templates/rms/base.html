<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}RMS Source history{% endblock %}</title><style>:root{color-scheme:light;font-family:system-ui,sans-serif;color:#17212b;background:#f7f9fb}body{margin:0;line-height:1.5}main{max-width:70rem;margin:0 auto;padding:2rem 1rem 3rem}h1,h2{line-height:1.2}h1{margin-bottom:.35rem}.notice{border-left:.35rem solid #005ea8;background:#e7f2fb;padding:.75rem 1rem}.card{background:#fff;border:1px solid #b8c4ce;border-radius:.25rem;padding:1rem;margin:1rem 0}dl{display:grid;grid-template-columns:minmax(11rem,1fr) 3fr;gap:.4rem 1rem}dt{font-weight:700}dd{margin:0;overflow-wrap:anywhere}table{border-collapse:collapse;width:100%}th,td{border:1px solid #82909c;padding:.65rem;text-align:left;vertical-align:top}th{background:#edf1f4}code{overflow-wrap:anywhere}a{color:#004b8d}a:focus{outline:3px solid #e59f00;outline-offset:2px}@media(max-width:40rem){dl{grid-template-columns:1fr;gap:.2rem}dd{margin-bottom:.65rem}table{font-size:.9rem}}</style></head><body><main>{% block content %}{% endblock %}</main></body></html>
