<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}RMS{% endblock %}</title><style>:root{color-scheme:light;font-family:system-ui,sans-serif;color:#17212b;background:#f7f9fb}body{margin:0;line-height:1.5}main{max-width:70rem;margin:0 auto;padding:2rem 1rem 3rem}h1,h2,h3{line-height:1.2}h1{margin-bottom:.35rem}.notice,.warning,.error{border-left:.35rem solid #005ea8;background:#e7f2fb;padding:.75rem 1rem}.warning{border-color:#9a6700;background:#fff8c5}.error{border-color:#b42318;background:#fef3f2}.card{background:#fff;border:1px solid #b8c4ce;border-radius:.25rem;padding:1rem;margin:1rem 0}dl{display:grid;grid-template-columns:minmax(11rem,1fr) 3fr;gap:.4rem 1rem}dt{font-weight:700}dd{margin:0;overflow-wrap:anywhere}table{border-collapse:collapse;width:100%}th,td{border:1px solid #82909c;padding:.65rem;text-align:left;vertical-align:top}th{background:#edf1f4}code{overflow-wrap:anywhere}a{color:#004b8d}a:focus,button:focus,input:focus,select:focus,textarea:focus{outline:3px solid #e59f00;outline-offset:2px}.field{display:grid;gap:.25rem;margin:.8rem 0}.field input,.field select,.field textarea{font:inherit;max-width:52rem;padding:.45rem;border:1px solid #52616b;border-radius:.2rem}.field textarea{min-height:6rem}.required::after{content:" (required)";font-weight:400}.muted{color:#43515c}.actions{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}.status{min-height:1.5rem}.contribution{border:1px solid #b8c4ce;padding:.8rem;margin:.8rem 0}.tag{display:inline-block;background:#e7f2fb;border:1px solid #78a9d1;border-radius:1rem;padding:.1rem .5rem}@media(max-width:40rem){dl{grid-template-columns:1fr;gap:.2rem}dd{margin-bottom:.65rem}table{font-size:.9rem}}</style></head><body><main>{% block content %}{% endblock %}</main><script src="/static/rms/rms_forms.js" defer></script></body></html>
